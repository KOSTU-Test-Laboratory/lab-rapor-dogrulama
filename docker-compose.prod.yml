# Sunucu (HTTPS) kurulumu için: .env içinde COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN tanımlı olmalı}
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy_data:/data", "caddy_config:/config"]
    depends_on: [app]
volumes:
  caddy_data: {}
  caddy_config: {}
