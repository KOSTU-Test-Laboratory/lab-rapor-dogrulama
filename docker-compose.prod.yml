# Production: .env içindeki COMPOSE_FILE, bu dosyayı temel Compose dosyasıyla birlikte yükler.
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN tanımlı olmalı}
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy_data:/data", "caddy_config:/config"]
    depends_on:
      app:
        condition: service_healthy
      qr:
        condition: service_healthy
volumes:
  caddy_data: {}
  caddy_config: {}
