services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment: {DATA_DIR: /data}
    volumes: [dbdata:/data]
    ports: ["${BIND:-127.0.0.1}:3000:3000"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
volumes:
  dbdata: {}
